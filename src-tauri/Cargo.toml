[package]
name = "notesproject"
version = "0.1.0"
description = "A fast local Markdown notes viewer/editor"
authors = ["Suresh"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
typst-as-lib = { version = "0.15.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts", "packages", "ureq", "typst-html"] }
typst = "0.14.2"
typst-html = "0.14.2"
typst-pdf = "0.14.2"
typst-svg = "0.14.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
typst-library = { path = "../vendor/typst-library-0.14.2" }
